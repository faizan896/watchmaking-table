<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS — Watch Design Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Archivo+Narrow:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500;600&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110;--panel:#191817;--line:#2c2a28;--ink:#e9e4d8;--dim:#8d867a;--acc:#c9391b;
  --serif:'Cormorant Garamond',Georgia,serif;--grot:'Archivo Narrow',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--grot);overflow:hidden}
#app{display:grid;grid-template-columns:1fr 336px;height:100%}

/* ————— stage ————— */
#stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{max-width:100%;max-height:100%;display:block}
#brand{position:absolute;top:20px;left:26px;pointer-events:none;display:flex;align-items:center;gap:12px}
#logo{width:52px;height:30px;flex:none}
#logo path{fill:var(--ink)}
#logo circle{fill:var(--acc)}
#kanjiLogo{font-family:'Yuji Syuku',serif;font-size:38px;line-height:1;color:var(--ink);display:none;margin-right:2px}
#brand.k #logo{display:none}
#brand.k #kanjiLogo{display:block}
#brand b{font-size:21px;display:block;line-height:1;letter-spacing:.34em;font-weight:600}
#brand span{font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;display:block;margin-top:3px}
#specline{position:absolute;bottom:20px;left:26px;font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;line-height:1.9;pointer-events:none}
#stageBtns{position:absolute;top:20px;right:20px;display:flex;gap:8px}
.gbtn{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  background:#1d1c1a;border:1px solid var(--line);padding:8px 12px;cursor:pointer;user-select:none}
.gbtn:hover{border-color:#57524a}
#bgRow{position:absolute;bottom:20px;right:22px;display:flex;gap:7px}
.bgs{width:17px;height:17px;border-radius:50%;border:1px solid #4a453e;cursor:pointer}

/* ————— panel ————— */
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1 0 33.33%;padding:10px 3px;text-align:center;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
#body{flex:1;overflow-y:auto;padding:16px 16px 26px}
#body::-webkit-scrollbar{width:7px}
#body::-webkit-scrollbar-thumb{background:#2f2c29}
.grp{margin-bottom:20px}
.grp h4{font-size:9px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:9px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#1e1d1b;color:#cfc8ba;padding:7px 10px;
  font-size:11.5px;cursor:pointer;user-select:none;transition:.15s;line-height:1.25}
.chip:hover{border-color:#57524a;color:var(--ink)}
.chip.on{background:var(--ink);color:#17150f;border-color:var(--ink);font-weight:500}
.sw{width:26px;height:26px;padding:0;border-radius:3px}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.presets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pcard{cursor:pointer;text-align:center;border:1px solid var(--line);background:#1c1b19;padding:5px 3px 6px;transition:.15s}
.pcard:hover{border-color:#57524a;background:#232220}
.pcard canvas{width:100%;height:auto;display:block}
.pcard span{display:block;font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:3px}
.tin{width:100%;background:#1e1d1b;border:1px solid var(--line);color:var(--ink);
  padding:10px 12px;font-family:var(--serif);font-style:italic;font-size:17px;outline:none}
.tin:focus{border-color:#57524a}
.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:-2px}
.bigbtn{text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  padding:13px 0;margin-bottom:8px;cursor:pointer;user-select:none;
  background:var(--ink);color:#17150f;font-weight:600}
.bigbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.bigbtn:hover{opacity:.88}
.row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.row label{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;width:86px;flex:none}
.row input[type=range]{flex:1;accent-color:var(--acc);height:3px}
.row output{font-size:11px;color:var(--ink);width:46px;text-align:right;font-variant-numeric:tabular-nums}
#foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex:none}
#foot div{flex:1;text-align:center;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:10px 0;border:1px solid var(--line);cursor:pointer;user-select:none;background:#1d1c1a}
#foot div:hover{border-color:#57524a}
#foot .prime{background:var(--ink);color:#17150f;border-color:var(--ink);font-weight:600}
/* ————— guide ————— */
#guide{position:fixed;inset:0;z-index:60;background:rgba(9,9,8,.86);
  display:none;align-items:center;justify-content:center;padding:24px}
#guide.on{display:flex}
.gcard{max-width:440px;background:var(--panel);border:1px solid var(--line);padding:34px 34px 24px;text-align:center}
.gmark{height:44px;margin-bottom:18px}
.gmark svg{height:44px}
.gmark path{fill:var(--ink)}.gmark circle{fill:var(--acc)}
.gcard h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;margin-bottom:12px;color:var(--ink)}
.gcard p{font-size:14px;line-height:1.75;color:#b6ae9f;margin-bottom:24px}
.gcard p b{color:var(--ink);font-weight:500}
.gnav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.gnav span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:var(--dim);user-select:none}
.gnav span:hover{color:var(--ink)}
.gprime{background:var(--ink);color:#17150f !important;padding:9px 20px;font-weight:600}
.gprime:hover{opacity:.88}
.gdots{display:flex;gap:6px}
.gdots i{width:5px;height:5px;border-radius:50%;background:rgba(242,236,221,.2)}
.gdots i.on{background:var(--acc)}
/* ————— glossary ————— */
#gloss{position:fixed;inset:0;z-index:61;background:rgba(9,9,8,.9);
  display:none;align-items:center;justify-content:center;padding:24px}
#gloss.on{display:flex}
.glossbox{max-width:560px;max-height:80vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);padding:26px 30px 30px}
.glossbox h3{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink);margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center}
.glossbox h3 span{cursor:pointer;font-family:var(--grot);font-style:normal;font-size:15px;color:var(--dim)}
.glossbox h3 span:hover{color:var(--ink)}
.gitem{border-top:1px solid var(--line);padding:13px 0}
.gitem b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:5px;font-weight:500}
.gitem span{font-size:13px;line-height:1.65;color:#a9a294}
/* ————— tab help + live values ————— */
.tabhelp{font-size:12px;line-height:1.7;color:#8f8778;border-left:2px solid var(--acc);
  padding:2px 0 2px 12px;margin-bottom:18px}
.grp h4{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp h4 em{font-style:normal;color:#c3bbaa;letter-spacing:.04em;text-transform:none;font-size:11px;font-family:var(--serif);font-style:italic}
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr 52%}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .chip{padding:10px 13px;font-size:13px}
  .sw{width:32px;height:32px}
  .tab{flex:1 0 25%;padding:12px 3px;font-size:9px}
  #brand{top:14px;left:16px}#logo{width:42px}
  #brand b{font-size:17px}
  #specline{font-size:9px;left:16px;bottom:14px}
  #stageBtns{top:14px;right:14px}
  .presets{grid-template-columns:1fr 1fr}
}
</style>
</head>

      <div class="prime" id="bSave">Save design</div>
    </div>
  </div>
</div>

<div id="guide">

    </div>
  </div>
</div>
<div id="gloss">
  <div class="glossbox">

</div>

/* ————— materials ————— */
const METAL={
  steel :{lo:'#6f7274',mid:'#c9ccce',hi:'#f4f6f7',ink:'#3d4042',name:'Steel'},

/* ============================================================
   THE AXIS MARK
   Two orbits crossing on a shared pivot. Each ring swells at the
   flank and tapers at the tips — a stroke, not a hoop.
   ============================================================ */
function orbitPoints(a,b,rotDeg,wMax,wMin,steps){
  steps=steps||140;
  const rot=rotDeg*Math.PI/180, cs=Math.cos(rot), sn=Math.sin(rot);
  const out=[],inn=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps*TAU;
    const ct=Math.cos(t), st=Math.sin(t);
    const px=a*ct, py=b*st;
    /* outward normal of the ellipse */
    let nx=ct/a, ny=st/b;
    const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    const w=(wMin+(wMax-wMin)*Math.abs(st))/2;
    const ox=px+nx*w, oy=py+ny*w, ix=px-nx*w, iy=py-ny*w;
    out.push([ox*cs-oy*sn, ox*sn+oy*cs]);
    inn.push([ix*cs-iy*sn, ix*sn+iy*cs]);
  }
  return {out,inn};
}
function ptsToPath(p){
  const {out,inn}=p;
  let d='M'+out[0][0].toFixed(2)+' '+out[0][1].toFixed(2);
  for(let i=1;i<out.length;i++)d+='L'+out[i][0].toFixed(2)+' '+out[i][1].toFixed(2);
  d+='Z M'+inn[0][0].toFixed(2)+' '+inn[0][1].toFixed(2);
  for(let i=inn.length-1;i>=0;i--)d+='L'+inn[i][0].toFixed(2)+' '+inn[i][1].toFixed(2);
  return d+'Z';
}
const MARK={a:1,b:.44,tilt:32,wMax:.20,wMin:.045};
function markPts(scale){
  const M=MARK,s=scale;
  return [orbitPoints(M.a*s,M.b*s,-M.tilt,M.wMax*s,M.wMin*s),
          orbitPoints(M.a*s,M.b*s, M.tilt,M.wMax*s,M.wMin*s)];
}
/* draw the mark on any 2d context, centred on (0,0) */
function drawMark(c,scale,col,pivotCol){
  const rings=markPts(scale);
  c.save();c.fillStyle=col;
  rings.forEach(({out,inn})=>{
    c.beginPath();
    c.moveTo(out[0][0],out[0][1]);
    for(let i=1;i<out.length;i++)c.lineTo(out[i][0],out[i][1]);
    c.closePath();
    c.moveTo(inn[inn.length-1][0],inn[inn.length-1][1]);
    for(let i=inn.length-2;i>=0;i--)c.lineTo(inn[i][0],inn[i][1]);
    c.closePath();
    c.fill('evenodd');
  });
  if(pivotCol){c.fillStyle=pivotCol;c.beginPath();c.arc(0,0,scale*.085,0,TAU);c.fill();}
  c.restore();
}

function lerpHex(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function shade(hex,t){ return t<0?lerpHex(hex,'#000000',-t):lerpHex(hex,'#ffffff',t); }
/* ============================================================
   GEOMETRY — case families as real outlines
   ============================================================ */
function pathRound(c,R){c.beginPath();c.arc(0,0,R,0,TAU);}
function pathRRect(c,w,h,r){
  c.beginPath();
  c.moveTo(-w+r,-h);c.lineTo(w-r,-h);c.quadraticCurveTo(w,-h,w,-h+r);
  c.lineTo(w,h-r);c.quadraticCurveTo(w,h,w-r,h);
  c.lineTo(-w+r,h);c.quadraticCurveTo(-w,h,-w,h-r);
  c.lineTo(-w,-h+r);c.quadraticCurveTo(-w,-h,-w+r,-h);c.closePath();
}
function pathCushion(c,R){
  const k=R*.92;c.beginPath();
  c.moveTo(0,-R);
  c.bezierCurveTo(k,-R,R,-k,R,0);c.bezierCurveTo(R,k,k,R,0,R);
  c.bezierCurveTo(-k,R,-R,k,-R,0);c.bezierCurveTo(-R,-k,-k,-R,0,-R);c.closePath();
}
function pathTonneau(c,R){
  const w=R*.86,h=R*1.14;c.beginPath();
  c.moveTo(-w,0);
  c.bezierCurveTo(-w,-h*.62,-w*.56,-h,0,-h);
  c.bezierCurveTo(w*.56,-h,w,-h*.62,w,0);
  c.bezierCurveTo(w,h*.62,w*.56,h,0,h);
  c.bezierCurveTo(-w*.56,h,-w,h*.62,-w,0);c.closePath();
}
function pathPoly(c,n,R,rot){
  c.beginPath();
  for(let i=0;i<n;i++){const a=rot+i*TAU/n;const x=Math.cos(a)*R,y=Math.sin(a)*R;i?c.lineTo(x,y):c.moveTo(x,y);}
  c.closePath();
}

  tonneau   :{n:'Tonneau',      path:(c,R)=>pathTonneau(c,R),                   ap:.845,ow:.86},
  rect      :{n:'Rectangular',  path:(c,R)=>pathRRect(c,R*.68,R*1.16,R*.09),    ap:.665,ow:.68,rect:1},

/* deterministic noise: a design must look identical on every repaint */
let _sd=1;
function seed(s){_sd=s>>>0||1;}
function rnd(){_sd^=_sd<<13;_sd^=_sd>>>17;_sd^=_sd<<5;return ((_sd>>>0)%100000)/100000;}

/* ————— metal shading: the whole illusion lives here ————— */
function metalFill(c,R,m,finish,ang){
  const M=METAL[m];
  if(finish==='brush'){
    const g=c.createLinearGradient(-R,-R,R,R);
    g.addColorStop(0,shade(M.mid,.10));g.addColorStop(.28,M.lo);g.addColorStop(.5,M.mid);
    g.addColorStop(.72,M.lo);g.addColorStop(1,shade(M.mid,.06));
    return g;
  }
  if(finish==='sand'){
    const g=c.createRadialGradient(-R*.3,-R*.35,R*.05,0,0,R*1.25);
    g.addColorStop(0,shade(M.mid,.06));g.addColorStop(.6,M.lo);g.addColorStop(1,shade(M.lo,-.2));
    return g;
  }
  /* polished: sharp bright/dark banding = mirror */
  const g=c.createLinearGradient(-R*.9,-R,R*.9,R);
  g.addColorStop(0,M.hi);g.addColorStop(.14,M.mid);g.addColorStop(.3,M.lo);
  g.addColorStop(.46,M.hi);g.addColorStop(.58,M.mid);g.addColorStop(.74,M.lo);
  g.addColorStop(.88,M.hi);g.addColorStop(1,M.mid);
  return g;
}
function brushStrokes(c,R,alpha){
  seed(7331);
  c.save();c.globalAlpha=alpha;c.lineWidth=.7;
  for(let i=-R;i<R;i+=1.6){
    c.strokeStyle=rnd()>.5?'#ffffff':'#000000';
    c.globalAlpha=alpha*(.25+rnd()*.75);
    c.beginPath();c.moveTo(-R*1.2,i);c.lineTo(R*1.2,i+R*.12);c.stroke();
  }
  c.restore();
}

const ARTDIAL={
  clay :{base:'#b4573a',ink:'#f6efe4'}, grass:{base:'#2f5c33',ink:'#f6f4e8'},
  starry:{base:'#101a3c',ink:'#e9dfae'}, wave:{base:'#12395e',ink:'#f2ece0'},
  mondrian:{base:'#f4f1e8',ink:'#141414'}, klimt:{base:'#8a6412',ink:'#20180a'},

  nebula:{base:'#150d24',ink:'#e6dcf5'}, carbon:{base:'#191a1c',ink:'#e6e6e6'},
  topo:{base:'#e6ddc6',ink:'#2f2a20'}, lava:{base:'#2a2724',ink:'#e8e2d4'},

function dialTexture(c,R,tex,col){
  const D=DIALCOL[col],base=D.base;
  c.save();c.beginPath();c.arc(0,0,R,0,TAU);c.clip();
  if(tex==='sunray'){
    for(let i=0;i<360;i++){
      const a=i*TAU/360, amt=Math.abs(Math.sin(i*.6));
      c.strokeStyle=i%2?`rgba(255,255,255,${.02+.11*amt})`:`rgba(0,0,0,${.02+.09*(1-amt)})`;
      c.lineWidth=2.2;c.beginPath();c.moveTo(0,0);
      c.lineTo(Math.cos(a)*R*1.05,Math.sin(a)*R*1.05);c.stroke();
    }
    const g=c.createRadialGradient(-R*.3,-R*.4,R*.05,0,0,R);
    g.addColorStop(0,'rgba(255,255,255,.20)');g.addColorStop(.55,'rgba(255,255,255,0)');
    g.addColorStop(1,'rgba(0,0,0,.18)');c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
  }else if(tex==='enamel'){
    const g=c.createRadialGradient(-R*.32,-R*.36,R*.03,0,0,R*1.15);
    g.addColorStop(0,shade(base,.35));g.addColorStop(.5,base);g.addColorStop(1,shade(base,-.10));
    c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
    c.globalAlpha=.5;c.fillStyle='rgba(255,255,255,.5)';
    c.beginPath();c.ellipse(-R*.32,-R*.36,R*.42,R*.28,-.5,0,TAU);c.fill();c.globalAlpha=1;
  }else if(tex==='guilloche'){
    c.strokeStyle='rgba(0,0,0,.16)';c.lineWidth=1;
    for(let r=4;r<R;r+=5){c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();}
    c.strokeStyle='rgba(255,255,255,.10)';
    for(let i=0;i<120;i++){const a=i*TAU/120;
      c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*R,Math.sin(a)*R);c.stroke();}
  }else if(tex==='tapestry'){
    c.strokeStyle='rgba(0,0,0,.20)';c.lineWidth=1;
    for(let i=-R;i<R;i+=7){
      c.beginPath();c.moveTo(i,-R);c.lineTo(i,R);c.stroke();
      c.beginPath();c.moveTo(-R,i);c.lineTo(R,i);c.stroke();
    }
    c.strokeStyle='rgba(255,255,255,.13)';
    for(let i=-R;i<R;i+=7){
      c.beginPath();c.moveTo(i+1.2,-R);c.lineTo(i+1.2,R);c.stroke();
      c.beginPath();c.moveTo(-R,i+1.2);c.lineTo(R,i+1.2);c.stroke();
    }
  }else if(tex==='sector'){
    c.strokeStyle=D.ink;c.globalAlpha=.85;
    [R*.94,R*.66,R*.34].forEach((r,i)=>{c.lineWidth=i?1.1:1.6;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();});
    c.lineWidth=1.1;
    for(let h=0;h<12;h++){const a=h*TAU/12;
      c.beginPath();c.moveTo(Math.cos(a)*R*.66,Math.sin(a)*R*.66);
      c.lineTo(Math.cos(a)*R*.94,Math.sin(a)*R*.94);c.stroke();}
    c.globalAlpha=1;
  }else if(tex==='fume'){
    const g=c.createRadialGradient(0,0,R*.06,0,0,R);
    g.addColorStop(0,shade(base,.30));g.addColorStop(.55,base);g.addColorStop(1,shade(base,-.62));
    c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
  }else if(tex==='grain'){
    seed(20260716);
    c.fillStyle='rgba(255,255,255,.07)';
    for(let i=0;i<1500;i++){c.beginPath();c.arc((rnd()-.5)*2*R,(rnd()-.5)*2*R,rnd()*1.5,0,TAU);c.fill();}
    c.fillStyle='rgba(0,0,0,.09)';
    for(let i=0;i<1500;i++){c.beginPath();c.arc((rnd()-.5)*2*R,(rnd()-.5)*2*R,rnd()*1.5,0,TAU);c.fill();}
  }else if(tex==='linen'){
    c.globalAlpha=.5;
    for(let i=-R;i<R;i+=2){
      c.strokeStyle='rgba(255,255,255,.09)';c.lineWidth=1;
      c.beginPath();c.moveTo(-R,i);c.lineTo(R,i);c.stroke();
      c.strokeStyle='rgba(0,0,0,.09)';
      c.beginPath();c.moveTo(i,-R);c.lineTo(i,R);c.stroke();
    }
    c.globalAlpha=1;
  }else if(ARTDIAL[tex]){
    artDial(c,R,tex);
  }else{ /* matte */
    const g=c.createRadialGradient(-R*.3,-R*.4,R*.05,0,0,R*1.1);
    g.addColorStop(0,shade(base,.10));g.addColorStop(1,shade(base,-.12));
    c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
  }
  c.restore();
}
/* ============================================================
   ART DIALS — the dial treated as a canvas
   ============================================================ */
function artDial(c,R,k){
  const A=ARTDIAL[k];
  c.fillStyle=A.base;c.fillRect(-R,-R,2*R,2*R);
  const line='rgba(246,240,228,.92)';
  if(k==='clay'){
    /* crushed brick, then the white court lines seen from above */
    seed(5150);
    for(let i=0;i<3000;i++){
      c.fillStyle=rnd()>.5?'rgba(255,190,150,.10)':'rgba(90,30,15,.13)';
      c.beginPath();c.arc((rnd()-.5)*2*R,(rnd()-.5)*2*R,rnd()*2.2,0,TAU);c.fill();
    }
    const g=c.createRadialGradient(-R*.3,-R*.4,R*.05,0,0,R*1.2);
    g.addColorStop(0,'rgba(255,200,160,.18)');g.addColorStop(1,'rgba(60,20,10,.30)');
    c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
    c.strokeStyle=line;c.lineWidth=R*.030;
    c.strokeRect(-R*.62,-R*.86,R*1.24,R*1.72);      /* doubles court */
    c.lineWidth=R*.022;
    c.strokeRect(-R*.44,-R*.86,R*.88,R*1.72);       /* singles */
    c.beginPath();c.moveTo(-R*.44,-R*.30);c.lineTo(R*.44,-R*.30);
    c.moveTo(-R*.44,R*.30);c.lineTo(R*.44,R*.30);
    c.moveTo(0,-R*.30);c.lineTo(0,R*.30);           /* service boxes */
    c.moveTo(-R*.62,0);c.lineTo(R*.62,0);           /* the net */
    c.stroke();
    c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=R*.010;
    for(let y=-R*.03,st2=Math.max(R*.014,1);y<R*.04;y+=st2){c.beginPath();c.moveTo(-R*.62,y);c.lineTo(R*.62,y);c.stroke();}
  }else if(k==='grass'){
    /* mown stripes, then the same court in white */
    for(let i=-10;i<10;i++){
      c.fillStyle=i%2?'rgba(255,255,255,.055)':'rgba(0,0,0,.07)';
      c.fillRect(-R,i*R*.11,2*R,R*.11);
    }
    seed(7712);
    for(let i=0;i<1800;i++){
      c.strokeStyle=rnd()>.5?'rgba(190,225,160,.10)':'rgba(10,40,15,.12)';
      c.lineWidth=1;const px=(rnd()-.5)*2*R,py=(rnd()-.5)*2*R;
      c.beginPath();c.moveTo(px,py);c.lineTo(px+(rnd()-.5)*4,py-rnd()*5);c.stroke();
    }
    c.strokeStyle=line;c.lineWidth=R*.030;
    c.strokeRect(-R*.62,-R*.86,R*1.24,R*1.72);
    c.lineWidth=R*.022;
    c.strokeRect(-R*.44,-R*.86,R*.88,R*1.72);
    c.beginPath();c.moveTo(-R*.44,-R*.30);c.lineTo(R*.44,-R*.30);
    c.moveTo(-R*.44,R*.30);c.lineTo(R*.44,R*.30);
    c.moveTo(0,-R*.30);c.lineTo(0,R*.30);c.stroke();
    c.strokeStyle='rgba(245,245,240,.85)';c.lineWidth=R*.028;
    c.beginPath();c.moveTo(-R*.66,0);c.lineTo(R*.66,0);c.stroke();
  }else if(k==='starry'){
    const g=c.createRadialGradient(R*.3,-R*.45,R*.02,0,0,R*1.3);
    g.addColorStop(0,'#2b4a86');g.addColorStop(.5,'#16265a');g.addColorStop(1,'#080d24');
    c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
    /* the swirl */
    c.lineCap='round';
    for(let s=0;s<3;s++){
      const cx=[-R*.3,R*.36,-R*.1][s],cy=[-R*.18,R*.32,R*.55][s],rr=[R*.46,R*.3,R*.2][s];
      for(let i=0;i<9;i++){
        c.strokeStyle=`rgba(${150+i*8},${180+i*6},${235},${.16+i*.02})`;
        c.lineWidth=R*.022;
        c.beginPath();
        for(let t2=0;t2<Math.PI*2.6;t2+=.12){
          const r2=rr*(.14+t2*.12)*(1-i*.02);
          const px=cx+Math.cos(t2+i*.4)*r2, py=cy+Math.sin(t2+i*.4)*r2*.82;

    seed(3141);

      const px=(rnd()-.5)*2*R,py=(rnd()-.5)*2*R,rr=rnd()*R*.035+R*.008;
      const sg=c.createRadialGradient(px,py,0,px,py,rr*3);
      sg.addColorStop(0,'rgba(255,236,170,.95)');sg.addColorStop(1,'rgba(255,220,140,0)');
      c.fillStyle=sg;c.beginPath();c.arc(px,py,rr*3,0,TAU);c.fill();
    }
  }else if(k==='wave'){
    const g=c.createLinearGradient(0,-R,0,R);
    g.addColorStop(0,'#dfe4e0');g.addColorStop(.34,'#4b7ea6');g.addColorStop(1,'#0d2a48');
    c.fillStyle=g;c.fillRect(-R,-R,2*R,2*R);
    /* the crest, curling from the left */
    for(let i=0;i<5;i++){
      c.fillStyle=i%2?'rgba(255,255,255,.85)':'rgba(20,70,110,.9)';
      c.beginPath();
      const off=i*R*.07;
      c.moveTo(-R*1.1,R*.30+off);
      c.bezierCurveTo(-R*.5,-R*.42+off,R*.15,-R*.30+off,R*.55,R*.22+off);

      c.stroke();
    }
  }else if(k==='mondrian'){
    c.fillStyle='#f4f1e8';c.fillRect(-R,-R,2*R,2*R);
    const blocks=[[-R,-R,R*.72,R*.86,'#c0392b'],[R*.30,-R,R*.7,R*.5,'#f4f1e8'],
      [R*.30,-R*.5,R*.7,R*.62,'#1c53a8'],[-R,R*.52,R*.62,R*.6,'#e3c027'],
      [-R*.38,R*.52,R*.5,R*.6,'#f4f1e8'],[R*.12,R*.12,R*.4,R*.4,'#f4f1e8']];
    blocks.forEach(b=>{c.fillStyle=b[4];c.fillRect(b[0],b[1],b[2],b[3]);});
    c.strokeStyle='#141414';c.lineWidth=R*.055;c.lineCap='butt';
    [[-R,R*.52,R,R*.52],[R*.30,-R,R*.30,R],[R*.12,-R,R*.12,R*.52],
     [-R,-R*.14,R*.30,-R*.14],[-R*.38,R*.52,-R*.38,R],[R*.30,-R*.5,R,-R*.5]]
      .forEach(l=>{c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke();});

const LAYOUTS={
  baton:'Baton', arabic:'Arabic', roman:'Roman', california:'California',
  explorer:'Explorer 3-6-9', dot:'Dots', mixed:'Mixed', arrow:'Arrowhead',
  bar:'Long bars', none:'No indices', quarter:'Quarters only', railroad:'Numerals + track'
};
const FONTS={grot:'"Archivo Narrow"',cond:'"Barlow Condensed"',serif:'"Cormorant Garamond"'};
const ROM=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];

function appliedBar(c,x,y,ang,w,h,M,lume){
  c.save();c.translate(x,y);c.rotate(ang);
  c.fillStyle='rgba(0,0,0,.4)';c.fillRect(-w/2+1.4,-h/2+1.6,w,h);
  const g=c.createLinearGradient(-w/2,0,w/2,0);
  g.addColorStop(0,M.lo);g.addColorStop(.35,M.hi);g.addColorStop(.62,M.mid);g.addColorStop(1,M.lo);
  c.fillStyle=g;c.fillRect(-w/2,-h/2,w,h);
  if(lume){c.fillStyle='#e5dfc2';c.fillRect(-w/2+w*.22,-h/2+h*.13,w*.56,h*.74);}
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=.6;c.strokeRect(-w/2,-h/2,w,h);
  c.restore();
}
function dialInk(){return ARTDIAL[S.texture]?ARTDIAL[S.texture].ink:DIALCOL[S.dialCol].ink;}

/* ============================================================
   SIGNATURE — the brand yields to the design, never the reverse.
   Placement, size and variant all follow what else is on the dial.
   ============================================================ */
function sigPlan(){
  /* what already occupies the dial? */
  const c=S.comp, l=S.layout;
  const topBusy = (c==='power');                       /* power reserve arcs across 12 */
  const botBusy = (c==='small'||c==='moon'||c==='chrono3'||S.date==='6');
  const ringBusy= (c==='gmt');                          /* inner 24h ring at .44 */
  const sideBusy= (c==='chrono2'||c==='chrono3');
  const numeralsAt12 = (l==='arabic'||l==='roman'||l==='railroad'||l==='mixed'||
                        l==='explorer'||l==='field'||l==='breguet');
  let y = -0.42, scale = 1, variant = S.sig;
  if(variant==='auto'){
    /* a crowded dial gets the mark alone; an open one gets the full lockup */
    variant = (sideBusy||ringBusy||ARTDIAL[S.texture]) ? 'mark'
            : (topBusy ? 'name' : 'full');
  }
  if(topBusy){ y = botBusy ? -0.20 : 0.30; }
  else if(ringBusy){ y = -0.26; scale = .82; }
  else if(sideBusy){ y = -0.40; scale = .84; }
  if(numeralsAt12 && y < -0.40) y = -0.36;
  if(botBusy && y > 0.20) y = -0.42;
  return {y,scale,variant};
}
/* the emblem: two orbits, or 軸 — the character that means axis */
function drawEmblem(c,size,ink){
  if(S.brand==='kanji'||S.brand==='both'){
    c.save();
    c.fillStyle=ink;c.textAlign='center';c.textBaseline='middle';
    c.font=`400 ${size*2.05}px "Yuji Syuku", "Cormorant Garamond", serif`;
    c.fillText('軸',0,size*.06);
    c.restore();
    if(S.brand==='both'){
      c.save();c.translate(0,size*1.55);drawMark(c,size*.62,ink,'#c9391b');c.restore();
    }
    return;
  }
  drawMark(c,size,ink,'#c9391b');
}
function drawSignature(c,dR,ink){
  if(S.sig==='none')return;
  const p=sigPlan(), art=!!ARTDIAL[S.texture];
  c.save();
  c.textAlign='center';c.textBaseline='middle';
  /* on a painted dial the signature needs its own separation from the art */
  if(art){c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=dR*.05;}
  const yTop=dR*p.y, s=p.scale;
  if(p.variant==='mark'){
    c.save();c.translate(0,yTop+dR*.045);drawEmblem(c,dR*.115*s,ink);c.restore();
  }else if(p.variant==='name'){
    c.fillStyle=ink;c.font=`600 ${dR*.098*s}px ${FONTS.grot}`;
    if(c.letterSpacing!==undefined)c.letterSpacing=`${dR*.052*s}px`;
    c.fillText('AXIS',dR*.026*s,yTop+dR*.05);
    if(c.letterSpacing!==undefined)c.letterSpacing='0px';
  }else{ /* full lockup: emblem above, wordmark below */
    const kan=(S.brand==='kanji');
    c.save();c.translate(0,yTop);drawEmblem(c,dR*.092*s,ink);c.restore();
    c.fillStyle=ink;c.font=`600 ${dR*.076*s}px ${FONTS.grot}`;
    if(c.letterSpacing!==undefined)c.letterSpacing=`${dR*.042*s}px`;
    c.fillText('AXIS',dR*.021*s,yTop+dR*(kan?.155:.115)*s);
    if(c.letterSpacing!==undefined)c.letterSpacing='0px';
  }
  /* the line at six, only where nothing else lives */
  if(!botBusySix()){
    c.globalAlpha=art?.7:.55;c.shadowBlur=art?dR*.04:0;
    c.fillStyle=ink;c.font=`400 ${dR*.040}px ${FONTS.grot}`;
    if(c.letterSpacing!==undefined)c.letterSpacing=`${dR*.012}px`;
    c.fillText(S.comp==='none'?'SWISS MADE':'AUTOMATIC',0,dR*.815);
  }
  c.restore();
}
function botBusySix(){
  return S.comp==='small'||S.comp==='moon'||S.comp==='chrono3'||S.date==='6'||
         S.layout==='field'||(S.layout==='arabic'&&S.texture==='sector');
}
function drawIndices(c,R,D,M){
  const ink=dialInk(), lay=S.layout, r=R*.80;
  const printed=S.indexMat==='printed';
  const skip=[];
  if(S.comp==='small')skip.push(6);
  if(S.comp==='moon')skip.push(6);
  if(S.comp==='chrono2'||S.comp==='chrono3')skip.push(3,9);
  if(S.comp==='chrono3')skip.push(6);
  if(S.date==='3')skip.push(3);
  if(S.date==='6')skip.push(6);
  if(lay==='none')return;
  for(let h=0;h<12;h++){
    const hour=h===0?12:h;
    if(skip.includes(hour))continue;
    const a=h*TAU/12-Math.PI/2, x=Math.cos(a)*r, y=Math.sin(a)*r;
    const isQ=h%3===0;
    if(lay==='quarter'&&!isQ){
      c.fillStyle=ink;c.globalAlpha=.85;
      c.beginPath();c.arc(Math.cos(a)*R*.86,Math.sin(a)*R*.86,R*.012,0,TAU);c.fill();c.globalAlpha=1;
      continue;
    }
    if(lay==='explorer'&&!(hour===3||hour===6||hour===9||hour===12)){
      printed?(c.fillStyle=ink,c.fillRect(x-R*.02,y-R*.055,R*.04,R*.11))
             :appliedBar(c,x,y,a+Math.PI/2,R*.045,R*.13,M,S.lume);
      continue;
    }
    if(lay==='baton'||lay==='bar'||lay==='mixed'&&!isQ||lay==='railroad'&&false){
      const len=lay==='bar'?R*.2:R*.12, w=lay==='bar'?R*.035:R*.045;
      if(printed){c.save();c.translate(x,y);c.rotate(a+Math.PI/2);c.fillStyle=ink;
        c.fillRect(-w/2,-len/2,w,len);c.restore();}
      else appliedBar(c,x,y,a+Math.PI/2,w,len,M,S.lume);
      continue;
    }
    if(lay==='dot'){
      const rr=hour===12?R*.038:R*.026;
      if(printed){c.fillStyle=ink;c.beginPath();c.arc(x,y,rr,0,TAU);c.fill();}
      else{
        c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.arc(x+1.4,y+1.6,rr,0,TAU);c.fill();
        const g=c.createRadialGradient(x-rr*.4,y-rr*.4,rr*.1,x,y,rr);
        g.addColorStop(0,M.hi);g.addColorStop(1,M.lo);c.fillStyle=g;
        c.beginPath();c.arc(x,y,rr,0,TAU);c.fill();
        if(S.lume){c.fillStyle='#e5dfc2';c.beginPath();c.arc(x,y,rr*.55,0,TAU);c.fill();}
      }
      continue;
    }
    if(lay==='arrow'){
      c.save();c.translate(x,y);c.rotate(a+Math.PI/2);
      c.beginPath();c.moveTo(0,-R*.075);c.lineTo(R*.045,R*.055);c.lineTo(-R*.045,R*.055);c.closePath();
      if(printed)c.fillStyle=ink;else{
        const g=c.createLinearGradient(-R*.045,0,R*.045,0);
        g.addColorStop(0,M.lo);g.addColorStop(.4,M.hi);g.addColorStop(1,M.mid);c.fillStyle=g;}
      c.fill();c.restore();continue;
    }
    if(lay==='california'){
      const useRom=(hour>=11||hour<=2), useArab=(hour>=4&&hour<=8);
      if(hour===12||hour===6){
        c.save();c.translate(x,y);c.rotate(hour===6?Math.PI:0);
        c.fillStyle=ink;c.beginPath();
        c.moveTo(-R*.05,-R*.02);c.lineTo(R*.05,-R*.02);c.lineTo(0,R*.06);c.closePath();c.fill();c.restore();
        continue;
      }
      c.fillStyle=ink;c.textAlign='center';c.textBaseline='middle';
      c.font=`600 ${R*.15}px ${useRom?FONTS.serif:FONTS.grot}`;
      c.fillText(useRom?ROM[hour%12]:String(hour),x,y);
      continue;
    }
    /* numerals */
    const txt=(lay==='roman')?ROM[h]:String(hour);
    c.fillStyle=ink;c.textAlign='center';c.textBaseline='middle';
    const fs=(lay==='roman')?R*.145:(lay==='railroad'?R*.135:R*.165);
    c.font=`${lay==='roman'?600:600} ${fs}px ${FONTS[S.numFont]}`;
    if(!printed&&lay!=='railroad'){
      c.fillStyle='rgba(0,0,0,.35)';c.fillText(txt,x+1.5,y+1.7);
      const g=c.createLinearGradient(x-fs/2,y,x+fs/2,y);
      g.addColorStop(0,M.lo);g.addColorStop(.4,M.hi);g.addColorStop(1,M.mid);c.fillStyle=g;
    }
    c.fillText(txt,x,y);
  }
}
function drawTrack(c,R,ink){
  if(S.track==='none')return;
  const rOut=R*.965,rIn=R*.90;
  if(S.track==='railroad'){
    c.strokeStyle=ink;c.globalAlpha=.9;c.lineWidth=1.1;
    c.beginPath();c.arc(0,0,rOut,0,TAU);c.stroke();
    c.beginPath();c.arc(0,0,rIn,0,TAU);c.stroke();
    for(let m=0;m<60;m++){const a=m*TAU/60-Math.PI/2;
      c.lineWidth=m%5===0?2.2:.9;
      c.beginPath();c.moveTo(Math.cos(a)*rIn,Math.sin(a)*rIn);
      c.lineTo(Math.cos(a)*rOut,Math.sin(a)*rOut);c.stroke();}
    c.globalAlpha=1;
  }else if(S.track==='ticks'){
    c.fillStyle=ink;
    for(let m=0;m<60;m++){const a=m*TAU/60-Math.PI/2,maj=m%5===0;
      const l=maj?R*.075:R*.04,w=maj?2.4:1.1;
      c.save();c.translate(Math.cos(a)*rOut,Math.sin(a)*rOut);c.rotate(a+Math.PI/2);
      c.fillRect(-w/2,-l,w,l);c.restore();}
  }else if(S.track==='dots'){
    c.fillStyle=ink;
    for(let m=0;m<60;m++){const a=m*TAU/60-Math.PI/2;
      c.beginPath();c.arc(Math.cos(a)*rOut*.98,Math.sin(a)*rOut*.98,m%5===0?1.9:.9,0,TAU);c.fill();}
  }
}
/* ————— complications ————— */
function subDial(c,cx,cy,rr,ink,label){
  c.save();c.translate(cx,cy);
  c.globalAlpha=.10;c.fillStyle='#000';c.beginPath();c.arc(0,0,rr,0,TAU);c.fill();c.globalAlpha=1;
  c.strokeStyle=ink;c.globalAlpha=.55;c.lineWidth=1;
  c.beginPath();c.arc(0,0,rr,0,TAU);c.stroke();
  c.lineWidth=.7;c.beginPath();c.arc(0,0,rr*.82,0,TAU);c.stroke();
  for(let i=0;i<12;i++){const a=i*TAU/12;
    c.lineWidth=i%3===0?1.6:.8;
    c.beginPath();c.moveTo(Math.cos(a)*rr*.8,Math.sin(a)*rr*.8);
    c.lineTo(Math.cos(a)*rr*.96,Math.sin(a)*rr*.96);c.stroke();}
  c.globalAlpha=1;
  if(label){c.fillStyle=ink;c.globalAlpha=.6;c.textAlign='center';
    c.font=`400 ${rr*.30}px ${FONTS.grot}`;c.fillText(label,0,rr*1.5);c.globalAlpha=1;}
  c.restore();
}
function chronoReg(c,cx,cy,rr,ink,marks,label){
  c.save();c.translate(cx,cy);
  c.globalAlpha=.13;c.fillStyle='#000';c.beginPath();c.arc(0,0,rr,0,TAU);c.fill();c.globalAlpha=1;
  /* snailed register floor */
  c.save();c.beginPath();c.arc(0,0,rr,0,TAU);c.clip();
  c.strokeStyle=ink;c.globalAlpha=.07;c.lineWidth=1;
  for(let i=2;i<rr;i+=2.4){c.beginPath();c.arc(rr*.06,0,i,0,TAU);c.stroke();}
  c.restore();
  c.strokeStyle=ink;c.globalAlpha=.6;c.lineWidth=1;
  c.beginPath();c.arc(0,0,rr,0,TAU);c.stroke();
  for(let i=0;i<marks;i++){
    const a=i*TAU/marks, maj=i%(marks/4)===0;
    c.lineWidth=maj?1.8:.8;c.globalAlpha=maj?.9:.55;
    c.beginPath();
    c.moveTo(Math.cos(a)*rr*(maj?.74:.82),Math.sin(a)*rr*(maj?.74:.82));
    c.lineTo(Math.cos(a)*rr*.95,Math.sin(a)*rr*.95);c.stroke();
  }
  c.globalAlpha=1;
  /* register hand, parked at zero */
  c.strokeStyle=ink;c.lineWidth=rr*.075;c.lineCap='round';
  c.beginPath();c.moveTo(0,rr*.12);c.lineTo(0,-rr*.72);c.stroke();
  c.fillStyle=ink;c.beginPath();c.arc(0,0,rr*.1,0,TAU);c.fill();
  if(label){c.globalAlpha=.55;c.textAlign='center';c.font=`400 ${rr*.26}px ${FONTS.grot}`;
    c.fillText(label,0,rr*.55);c.globalAlpha=1;}
  c.restore();
}
function drawComp(c,R,ink,M){
  if(S.comp==='chrono2'||S.comp==='chrono3'){
    const rr=R*.235;
    chronoReg(c,-R*.50,0,rr,ink,60,'60');              /* running seconds at 9 */
    chronoReg(c, R*.50,0,rr,ink,30,'30');              /* 30-minute counter at 3 */
    if(S.comp==='chrono3')chronoReg(c,0,R*.50,rr,ink,12,'12');  /* 12-hour at 6 */
    return;
  }
  if(S.comp==='small'){subDial(c,0,R*.44,R*.19,ink);}
  else if(S.comp==='gmt'){
    c.strokeStyle=ink;c.globalAlpha=.5;c.lineWidth=.8;
    c.beginPath();c.arc(0,0,R*.44,0,TAU);c.stroke();c.globalAlpha=1;
    c.fillStyle=ink;c.textAlign='center';c.textBaseline='middle';
    for(let h=0;h<24;h+=2){const a=h*TAU/24-Math.PI/2;
      c.globalAlpha=.75;c.font=`600 ${R*.055}px ${FONTS.grot}`;
      c.fillText(h===0?'24':String(h),Math.cos(a)*R*.37,Math.sin(a)*R*.37);}
    c.globalAlpha=1;
  }else if(S.comp==='moon'){
    const cx=0,cy=R*.44,rr=R*.20;
    c.save();c.translate(cx,cy);
    c.beginPath();c.arc(0,0,rr,Math.PI,0);c.closePath();c.clip();
    c.fillStyle='#1b2c4d';c.fillRect(-rr,-rr,2*rr,2*rr);
    [[-.5,-.4],[.3,-.55],[.6,-.2],[-.2,-.65]].forEach(p=>{
      c.fillStyle='#e9e3c8';c.beginPath();c.arc(p[0]*rr,p[1]*rr,rr*.045,0,TAU);c.fill();});
    const mg=c.createRadialGradient(-rr*.12,-rr*.45,rr*.05,0,-rr*.4,rr*.42);
    mg.addColorStop(0,'#f6ecc8');mg.addColorStop(1,'#d9c07a');
    c.fillStyle=mg;c.beginPath();c.arc(-rr*.05,-rr*.42,rr*.34,0,TAU);c.fill();
    c.restore();
    c.strokeStyle=M.mid;c.lineWidth=2;
    c.beginPath();c.arc(cx,cy,rr,Math.PI,0);c.stroke();
    c.beginPath();c.moveTo(cx-rr,cy);c.lineTo(cx+rr,cy);c.stroke();
  }else if(S.comp==='power'){
    const cy=-R*.42;
    c.strokeStyle=ink;c.globalAlpha=.6;c.lineWidth=1.4;
    c.beginPath();c.arc(0,cy,R*.2,Math.PI*.78,Math.PI*.22,true);c.stroke();
    c.globalAlpha=1;c.fillStyle=ink;c.textAlign='center';
    c.font=`400 ${R*.048}px ${FONTS.grot}`;c.fillText('RÉSERVE',0,cy+R*.1);
    c.strokeStyle=ink;c.lineWidth=2;
    c.beginPath();c.moveTo(0,cy);c.lineTo(Math.cos(-Math.PI*.35)*R*.17,cy+Math.sin(-Math.PI*.35)*R*.17);c.stroke();
  }
  if(S.date!=='none'){
    const a=(S.date==='3')?0:(S.date==='6'?Math.PI/2:-Math.PI/2);
    const dx=Math.cos(a)*R*.72,dy=Math.sin(a)*R*.72;
    const w=R*.135,h=R*.10;
    c.fillStyle='#f0ece1';c.fillRect(dx-w/2,dy-h/2,w,h);
    c.strokeStyle=M.mid;c.lineWidth=1.6;c.strokeRect(dx-w/2,dy-h/2,w,h);
    c.fillStyle='#1d1b17';c.textAlign='center';c.textBaseline='middle';
    c.font=`500 ${h*.78}px ${FONTS.grot}`;
    c.fillText(String(new Date().getDate()),dx,dy+1);
  }
}
/* ————— hands ————— */
const HANDS={dauphine:'Dauphine',sword:'Sword',leaf:'Leaf',alpha:'Alpha',baton:'Baton',
  cathedral:'Cathedral',mercedes:'Mercedes',syringe:'Syringe',breguet:'Breguet',snowflake:'Snowflake'};
function handPath(c,k,L,W){
  c.beginPath();
  switch(k){
    case 'dauphine': c.moveTo(0,-L);c.lineTo(W,0);c.lineTo(0,L*.1);c.lineTo(-W,0);break;
    case 'sword':    c.moveTo(0,-L);c.lineTo(W,-L*.72);c.lineTo(W*.7,L*.1);c.lineTo(-W*.7,L*.1);c.lineTo(-W,-L*.72);break;
    case 'leaf':     c.moveTo(0,-L);c.bezierCurveTo(W*1.7,-L*.55,W*.6,L*.02,0,L*.08);
                     c.bezierCurveTo(-W*.6,L*.02,-W*1.7,-L*.55,0,-L);break;
    case 'alpha':    c.moveTo(0,-L);c.lineTo(W*1.15,-L*.30);c.lineTo(W*.42,L*.1);c.lineTo(-W*.42,L*.1);c.lineTo(-W*1.15,-L*.30);break;
    case 'baton':    c.rect(-W*.55,-L,W*1.1,L*1.1);break;
    case 'syringe':  c.moveTo(-W*.34,L*.1);c.lineTo(-W*.34,-L*.55);c.lineTo(-W*.85,-L*.62);
                     c.lineTo(-W*.85,-L*.84);c.lineTo(-W*.16,-L*.88);c.lineTo(0,-L);
                     c.lineTo(W*.16,-L*.88);c.lineTo(W*.85,-L*.84);c.lineTo(W*.85,-L*.62);
                     c.lineTo(W*.34,-L*.55);c.lineTo(W*.34,L*.1);break;
    case 'snowflake':c.moveTo(0,-L);c.lineTo(W*.5,-L*.82);c.lineTo(W*1.25,-L*.76);
                     c.lineTo(W*1.25,-L*.46);c.lineTo(W*.5,-L*.4);c.lineTo(W*.42,L*.1);
                     c.lineTo(-W*.42,L*.1);c.lineTo(-W*.5,-L*.4);c.lineTo(-W*1.25,-L*.46);
                     c.lineTo(-W*1.25,-L*.76);c.lineTo(-W*.5,-L*.82);break;
    default:         c.moveTo(0,-L);c.lineTo(W,0);c.lineTo(0,L*.1);c.lineTo(-W,0);
  }
  c.closePath();
}
function drawHand(c,k,L,W,M,lume,blue){
  c.save();
  c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=5;c.shadowOffsetX=2.5;c.shadowOffsetY=3;
  if(k==='breguet'){
    c.strokeStyle=blue?'#2b4a9e':M.mid;c.lineWidth=W*.7;c.lineCap='round';
    c.beginPath();c.moveTo(0,L*.1);c.lineTo(0,-L*.72);c.stroke();
    c.lineWidth=W*.62;c.beginPath();c.arc(0,-L*.79,L*.075,0,TAU);c.stroke();
    c.beginPath();c.moveTo(0,-L*.86);c.lineTo(W*.55,-L*.93);c.lineTo(0,-L);c.lineTo(-W*.55,-L*.93);c.closePath();
    c.fillStyle=blue?'#2b4a9e':M.mid;c.fill();
    c.restore();return;
  }
  if(k==='cathedral'){
    c.fillStyle=blue?'#2b4a9e':M.mid;
    c.beginPath();c.rect(-W*.42,-L*.5,W*.84,L*.6);c.fill();
    c.beginPath();c.arc(0,-L*.62,W*1.05,0,TAU);c.fill();
    c.beginPath();c.moveTo(0,-L);c.lineTo(W*.5,-L*.76);c.lineTo(-W*.5,-L*.76);c.closePath();c.fill();
    if(lume){c.shadowColor='transparent';c.fillStyle='#e5dfc2';
      c.beginPath();c.arc(0,-L*.62,W*.62,0,TAU);c.fill();}
    c.restore();return;
  }
  if(k==='mercedes'){
    c.fillStyle=blue?'#2b4a9e':M.mid;
    c.beginPath();c.rect(-W*.45,-L*.5,W*.9,L*.6);c.fill();
    c.beginPath();c.arc(0,-L*.62,W*1.15,0,TAU);c.fill();
    c.beginPath();c.moveTo(0,-L);c.lineTo(W*.45,-L*.78);c.lineTo(-W*.45,-L*.78);c.closePath();c.fill();
    c.shadowColor='transparent';
    if(lume){c.fillStyle='#e5dfc2';c.beginPath();c.arc(0,-L*.62,W*.78,0,TAU);c.fill();}
    c.strokeStyle=blue?'#2b4a9e':M.ink;c.lineWidth=W*.28;
    for(let i=0;i<3;i++){const a=-Math.PI/2+i*TAU/3;
      c.beginPath();c.moveTo(0,-L*.62);
      c.lineTo(Math.cos(a)*W*.78,-L*.62+Math.sin(a)*W*.78);c.stroke();}
    c.restore();return;
  }
  handPath(c,k,L,W);
  if(blue){
    const g=c.createLinearGradient(-W,0,W,0);
    g.addColorStop(0,'#16295e');g.addColorStop(.45,'#3f63c4');g.addColorStop(1,'#1c3573');
    c.fillStyle=g;
  }else{
    const g=c.createLinearGradient(-W,-L,W,L*.1);
    g.addColorStop(0,M.lo);g.addColorStop(.42,M.hi);g.addColorStop(.6,M.mid);g.addColorStop(1,M.lo);
    c.fillStyle=g;
  }
  c.fill();
  c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=.7;c.stroke();
  if(lume&&k!=='baton'){
    c.save();handPath(c,k,L*.86,W*.5);c.fillStyle='#e5dfc2';c.fill();c.restore();
  }
  c.restore();
}

   THE WATCH
   ============================================================ */
function drawStrap(c,R,fam){
  const M=METAL[S.metal], k=S.strap;
  const halfW=(fam.slab||fam.ears)?R*.92:(fam.rect?R*.62:R*.56);
  const top=(fam.rect?R*1.16:R)* (fam.slab?.98:1);
  const far=R*3.05;
  if(k==='oyster'||k==='jubilee'||k==='president'||k==='mesh'){
    /* the folding clasp, closed, seen from above */
    const clasp=()=>{
      const cw=halfW*.80, cy=far*.86;
      const g=c.createLinearGradient(-cw,0,cw,0);
      g.addColorStop(0,M.lo);g.addColorStop(.30,M.mid);g.addColorStop(.5,M.hi);
      g.addColorStop(.72,M.mid);g.addColorStop(1,M.lo);
      c.fillStyle=g;
      if(c.roundRect){c.beginPath();c.roundRect(-cw,cy-halfW*.30,cw*2,halfW*.60,halfW*.10);c.fill();}
      else c.fillRect(-cw,cy-halfW*.30,cw*2,halfW*.60);
      c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1.2;c.stroke();
      c.strokeStyle='rgba(255,255,255,.30)';c.lineWidth=1;
      c.beginPath();c.moveTo(-cw*.82,cy-halfW*.20);c.lineTo(cw*.82,cy-halfW*.20);c.stroke();
      /* the release notch */
      c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1.4;
      c.beginPath();c.moveTo(-cw*.24,cy+halfW*.30);c.lineTo(-cw*.24,cy+halfW*.16);
      c.lineTo(cw*.24,cy+halfW*.16);c.lineTo(cw*.24,cy+halfW*.30);c.stroke();
      /* the mark, stamped small */
      c.save();c.translate(0,cy);drawMark(c,halfW*.17,'rgba(0,0,0,.42)',null);c.restore();
    };
    for(const dir of [-1,1]){
      if(k==='mesh'){
        c.save();c.beginPath();
        c.moveTo(-halfW,dir*top);c.lineTo(-halfW*.62,dir*far);
        c.lineTo(halfW*.62,dir*far);c.lineTo(halfW,dir*top);c.closePath();c.clip();
        const g=c.createLinearGradient(-halfW,0,halfW,0);
        g.addColorStop(0,M.lo);g.addColorStop(.4,M.mid);g.addColorStop(.62,M.hi);g.addColorStop(1,M.lo);
        c.fillStyle=g;c.fillRect(-halfW,-far,halfW*2,far*2);
        c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;
        for(let i=-far;i<far;i+=4){c.beginPath();c.moveTo(-halfW,i);c.lineTo(halfW,i+2);c.stroke();}
        for(let i=-halfW;i<halfW;i+=4){c.beginPath();c.moveTo(i,-far);c.lineTo(i+2,far);c.stroke();}
        c.restore();continue;
      }
      const rows=15, gap=.055;
      for(let i=0;i<rows;i++){
        const t=i/rows, t2=(i+1-gap)/rows;
        const y0=dir*(top+(far-top)*t), y1=dir*(top+(far-top)*t2);
        const w0=halfW*(1-t*.20), w1=halfW*(1-t2*.20);
        const cols=(k==='jubilee')?[.19,.125,.37,.125,.19]:(k==='president'?[.27,.46,.27]:[.29,.42,.29]);
        let x=-w0,x1=-w1;
        cols.forEach((cw,ci)=>{
          const centre=(cols.length===3&&ci===1)||(cols.length===5&&ci===2);
          const pol=(k==='jubilee')?(ci%2===1):centre;
          const round=(k==='president');
          const xa=x, xb=x+w0*2*cw, xc=x1+w1*2*cw, xd=x1;
          const rr=round?Math.abs(xb-xa)*.42:Math.abs(xb-xa)*.16;
          c.beginPath();
          if(c.roundRect){
            /* a link is a solid billet, not a flat quad */
            c.moveTo(xa+rr,y0);
            c.quadraticCurveTo(xa,y0,xa+ (xd-xa)*.14, y0+(y1-y0)*.16);
            c.lineTo(xd,y1-(y1-y0)*.10);
            c.quadraticCurveTo(xd,y1,xd+rr,y1);
            c.lineTo(xc-rr,y1);
            c.quadraticCurveTo(xc,y1,xc-(xc-xb)*.14,y1-(y1-y0)*.16);
            c.lineTo(xb,y0+(y1-y0)*.10);
            c.quadraticCurveTo(xb,y0,xb-rr,y0);
          }else{
            c.moveTo(xa,y0);c.lineTo(xb,y0);c.lineTo(xc,y1);c.lineTo(xd,y1);
          }
          c.closePath();
          const g=c.createLinearGradient(xa,0,xb,0);
          if(pol){
            g.addColorStop(0,M.lo);g.addColorStop(.18,M.mid);g.addColorStop(.42,M.hi);
            g.addColorStop(.66,M.mid);g.addColorStop(1,M.lo);
          }else{
            g.addColorStop(0,shade(M.lo,-.12));g.addColorStop(.30,M.mid);
            g.addColorStop(.55,M.hi);g.addColorStop(.78,M.mid);g.addColorStop(1,shade(M.lo,-.12));
          }
          c.fillStyle=g;c.fill();
          /* brushed top face on the outer links, polished flanks */
          if(!pol){
            c.save();c.clip();
            c.globalAlpha=.10;c.strokeStyle='#000';c.lineWidth=.8;
            for(let bx=xa;bx<xb;bx+=2.2){c.beginPath();c.moveTo(bx,y0);c.lineTo(bx,y1);c.stroke();}
            c.restore();
          }
          c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1;c.stroke();
          /* the bright edge where the link rolls over */
          c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=.9;

      c.fillStyle='rgba(0,0,0,.06)';

function drawBezel(c,R,fam,M){

      c.closePath();c.fillStyle='#d8d1bd';c.fill();
      c.beginPath();c.arc(0,0,R,Math.PI/2,-Math.PI/2);c.arc(0,0,rIn,-Math.PI/2,Math.PI/2,true);

      c.textAlign='center';c.textBaseline='middle';c.font=`600 ${bw*.46}px ${FONTS.grot}`;
      for(let h=0;h<24;h+=2){const a=h*TAU/24-Math.PI/2;

function drawCase(c,R,fam,M){

    c.fill();c.restore();

  c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=1.6;fam.path(c,R);c.stroke();
  c.restore();

function drawLugs(c,R,fam,M){
  const k=S.lug;if(k==='none'||fam.slab)return;
  const top=fam.rect?R*1.16:R;
  const positions=[[-.42,-1],[.42,-1],[-.42,1],[.42,1]];
  positions.forEach(p=>{
    const bx=p[0]*R, dir=p[1];
    c.save();c.translate(bx,dir*top*.94);
    c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=R*.08;c.shadowOffsetY=R*.03;
    c.beginPath();
    if(k==='wire'){
      c.lineWidth=R*.055;c.lineCap='round';c.strokeStyle=metalFill(c,R*.3,S.metal,'polish');
      c.moveTo(0,0);c.quadraticCurveTo(p[0]*R*.14,dir*R*.2,p[0]*R*.06,dir*R*.36);c.stroke();
      c.restore();return;
    }
    if(k==='straight'){c.rect(-R*.075,0,R*.15,dir*R*.36);}
    else if(k==='horn'){
      c.moveTo(-R*.1,0);
      c.quadraticCurveTo(-R*.12,dir*R*.28,p[0]*R*.02-R*.05,dir*R*.38);

    }
    c.fillStyle=metalFill(c,R*.4,S.metal,S.finish);c.fill();
    c.shadowColor='transparent';
    c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;c.stroke();

function drawPushers(c,R,fam,M){

  const x=(fam.ow||1)*R;
  [-1,1].forEach(dir=>{
    c.save();c.translate(x*.93,dir*R*.42);
    c.fillStyle=metalFill(c,R*.16,S.metal,'polish');
    c.fillRect(0,-R*.048,R*.12,R*.096);
    c.beginPath();c.arc(R*.14,0,R*.052,0,TAU);c.fill();
    c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=1;c.stroke();
    c.restore();
  });

function drawCrown(c,R,fam,M){
  const x=(fam.ow||1)*R*1.0;
  const w=R*.09,h=R*.14;
  c.save();c.translate(x,0);
  c.fillStyle=metalFill(c,R*.2,S.metal,'polish');
  c.fillRect(-w*.3,-h*.36,w*.5,h*.72);
  c.beginPath();c.roundRect?c.roundRect(0,-h/2,w,h,w*.28):c.rect(0,-h/2,w,h);c.fill();
  c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=1;c.stroke();
  c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1.1;
  for(let i=0;i<7;i++){const yy=-h/2+h*(i+.5)/7;
    c.beginPath();c.moveTo(.5,yy);c.lineTo(w-.5,yy);c.stroke();}

function drawCrystal(c,R){

  const ox=(S.tiltY||0)*R*.9, oy=-(S.tiltX||0)*R*.9;

  g.addColorStop(0,`rgba(255,255,255,${.26+lift*.22})`);
  g.addColorStop(.34,'rgba(255,255,255,.05)');
  g.addColorStop(1,'rgba(255,255,255,0)');

  c.globalAlpha=.10+lift*.14;c.fillStyle='#fff';

const base=document.createElement('canvas');
const BX=base.getContext('2d');
let geom={R:0,dR:0,w:0,h:0};
function renderBase(){
  const w=cv.width/DPR,h=cv.height/DPR;
  base.width=cv.width;base.height=cv.height;
  const X=BX;
  X.setTransform(DPR,0,0,DPR,0,0);
  X.clearRect(0,0,w,h);
  X.fillStyle=S.bg;X.fillRect(0,0,w,h);
  const fam=FAMILY[S.family],M=METAL[S.metal],D=DIALCOL[S.dialCol];
  const R=Math.min(w,h)*.185*(S.size/38);
  geom={R,dR:0,w,h,profile:S.view==='profile'};
  /* a zero-sized canvas (hidden tab, collapsed layout) would make every
     radius-relative step zero — never start drawing into nothing */
  if(!(R>1))return;
  if(S.view==='profile'){
    X.save();X.translate(w/2,h/2);
    drawProfile(X,R*1.05,fam,M);
    X.restore();
    return;
  }
  X.save();X.translate(w/2,h/2);
  /* ————— 2.5D tilt: the disc turns, the flank appears, light slides ————— */
  const tx=S.tiltX||0, ty=S.tiltY||0;
  const sx=Math.pow(Math.cos(ty),1.5), sy=Math.pow(Math.cos(tx),1.5);
  const depth=R*THICK[S.thick].v*4.2;
  if(tx||ty){
    /* the case side wall, revealed on the side turning away */
    X.save();X.scale(sx,sy);
    const steps=14;
    for(let i=steps;i>=1;i--){
      const k=i/steps;
      X.save();
      X.translate(-Math.sin(ty)*depth*k/sx*1.0, Math.sin(tx)*depth*k/sy*1.0);
      fam.path(X,R*(1-.004*k));
      X.fillStyle=shade(M.lo,-.34+.26*(1-k));
      X.fill();X.restore();
    }
    X.restore();
  }
  X.scale(sx,sy);
  drawStrap(X,R,fam);
  drawLugs(X,R,fam,M);
  drawCrown(X,R,fam,M);
  drawPushers(X,R,fam,M);
  drawCase(X,R,fam,M);
  drawBezel(X,R,fam,M);
  /* dial sits exactly inside the bezel aperture */
  const dR=R*fam.ap*(1-S.bezelW)-R*.006;
  geom={R,dR,w,h};
  X.save();X.beginPath();X.arc(0,0,dR,0,TAU);X.clip();
  const INK=dialInk();
  X.fillStyle=ARTDIAL[S.texture]?ARTDIAL[S.texture].base:D.base;
  X.fillRect(-dR,-dR,dR*2,dR*2);
  dialTexture(X,dR,S.texture,S.dialCol);
  drawTrack(X,dR,INK);
  if(S.chapter){X.strokeStyle=INK;X.globalAlpha=.35;X.lineWidth=1;
    X.beginPath();X.arc(0,0,dR*.70,0,TAU);X.stroke();X.globalAlpha=1;}
  drawIndices(X,dR,D,M);
  drawComp(X,dR,INK,M);
  drawSignature(X,dR,INK);
  X.restore(); /* dial clip */
  X.restore(); /* centre */
}
/* live layer: hands + crystal, drawn over the cached base */
function render(){
  if(baseDirty){renderBase();baseDirty=false;}
  const {R,dR,w,h}=geom;
  X.setTransform(DPR,0,0,DPR,0,0);
  X.clearRect(0,0,w,h);
  X.drawImage(base,0,0,w,h);
  if(geom.profile)return;   /* no hands visible from the side */
  const M=METAL[S.metal],D=DIALCOL[S.dialCol];
  X.save();X.translate(w/2,h/2);
  X.save();X.beginPath();X.arc(0,0,dR,0,TAU);X.clip();
  const now=new Date(),sec=now.getSeconds()+now.getMilliseconds()/1000;
  const blue=S.handMat==='blued';
  /* GMT: a fourth hand, one turn a day */
  if(S.comp==='gmt'){
    X.save();X.rotate((now.getHours()+now.getMinutes()/60)*TAU/24);
    X.strokeStyle='#c07a2e';X.lineWidth=dR*.022;X.lineCap='round';
    X.beginPath();X.moveTo(0,dR*.14);X.lineTo(0,-dR*.52);X.stroke();
    X.fillStyle='#c07a2e';X.beginPath();
    X.moveTo(0,-dR*.66);X.lineTo(dR*.055,-dR*.50);X.lineTo(-dR*.055,-dR*.50);X.closePath();X.fill();
    X.restore();
  }
  X.save();X.rotate(((now.getHours()%12)+now.getMinutes()/60)*TAU/12);
  drawHand(X,S.hands,dR*.52,dR*.055,M,S.lume,blue);X.restore();
  X.save();X.rotate((now.getMinutes()+sec/60)*TAU/60);
  drawHand(X,S.hands,dR*.80,dR*.042,M,S.lume,blue);X.restore();
  if(S.comp==='chrono2'||S.comp==='chrono3'){
    /* a chronograph at rest: the central hand is parked at twelve */
    X.save();
    X.strokeStyle='#c9391b';X.lineWidth=dR*.017;X.lineCap='round';
    X.beginPath();X.moveTo(0,dR*.20);X.lineTo(0,-dR*.88);X.stroke();
    X.fillStyle='#c9391b';
    X.beginPath();X.arc(0,dR*.20,dR*.030,0,TAU);X.fill();
    X.restore();
  }else if(S.comp!=='small'&&S.comp!=='moon'){
    X.save();X.rotate(sec*TAU/60);
    X.strokeStyle=blue?'#3f63c4':'#c9391b';X.lineWidth=dR*.014;X.lineCap='round';
    X.beginPath();X.moveTo(0,dR*.18);X.lineTo(0,-dR*.86);X.stroke();
    X.fillStyle=blue?'#3f63c4':'#c9391b';
    X.beginPath();X.arc(0,dR*.18,dR*.028,0,TAU);X.fill();X.restore();
  }else{
    X.save();X.translate(0,dR*.44);X.rotate(sec*TAU/60);
    X.strokeStyle=D.ink;X.lineWidth=dR*.008;
    X.beginPath();X.moveTo(0,dR*.05);X.lineTo(0,-dR*.16);X.stroke();X.restore();
  }
  X.fillStyle=metalFill(X,dR*.05,S.metal,'polish');
  X.beginPath();X.arc(0,0,dR*.032,0,TAU);X.fill();
  X.restore(); /* dial clip */
  drawCrystal(X,dR);
  X.restore();
}

  g.innerHTML=`<h4>${title}${sel?`<em>${swatch?(sel.n||''):sel.n}</em>`:''}</h4>`;

}

const GLOSSARY=[
  ['Case','The metal body that holds everything. Its shape family — round, cushion, tonneau, rectangular — sets the character before anything else is decided.'],
  ['Lugs','The horns the strap attaches to. Wire lugs are delicate and vintage; straight lugs are sporty; horn lugs curve down to hug the wrist.'],
  ['Bezel','The ring around the crystal. It can be plain, knurled for grip, fluted for light, or carry a scale: a dive bezel counts sixty minutes, a tachymètre reads speed.'],
  ['Dial','The face. Its texture is the difference between a flat print and a real object: sunray throws light in a fan, guilloché is engine-turned, grand feu is fired enamel.'],
  ['Indices','The hour markers. Applied indices are separate metal pieces set onto the dial and catch light; printed indices lie flat and read cleaner.'],
  ['Chapter ring','A fine circle drawn inside the minute track — it tightens the dial and separates numerals from the outer scale.'],
  ['Complication','Anything the watch does beyond hours and minutes: small seconds, a second time zone (GMT), a moonphase, a power reserve, a chronograph.'],
  ['Chronograph','A stopwatch. The pushers at 2 and 4 start, stop and reset a central hand; the small registers count elapsed minutes and hours.'],
  ['Crystal','The glass over the dial. Flat is honest and modern; domed bends the light at the edges; a box crystal stands the dial in a little vitrine — very vintage.'],
  ['Crown','The knurled wheel you wind and set the time with. Bigger and deeper knurling means you can use it with gloves on.'],
  ['Lume','Luminous compound on the hands and markers so the watch reads in the dark.'],
  ['Guilloché','A geometric pattern cut into the dial by a hand-turned engine. Rings, waves and grids that only appear when light rakes across.'],
  ['Tapisserie','A fine grid milled into the dial, most associated with integrated-bracelet sports watches. It gives depth without colour.'],
  ['Aventurine','Glass with copper flecks suspended in it — it reads as a night sky. Malachite, lapis and mother of pearl are natural stone dials cut into wafers.'],

/* ————— preset thumbnails: same engine, tiny canvas ————— */
function thumb(cvs,spec){
  const keep=JSON.parse(JSON.stringify(S));
  Object.assign(S,spec);S.tiltX=0;S.tiltY=0;
  const c=cvs.getContext('2d');
  const w=cvs.width,h=cvs.height;
  c.fillStyle='#1a1917';c.fillRect(0,0,w,h);
  const fam=FAMILY[S.family],M=METAL[S.metal],D=DIALCOL[S.dialCol];
  const R=w*.36;
  c.save();c.translate(w/2,h/2);
  drawLugs(c,R,fam,M);
  drawCase(c,R,fam,M);
  drawBezel(c,R,fam,M);
  const dR=R*fam.ap*(1-S.bezelW)-R*.006;
  c.save();c.beginPath();c.arc(0,0,dR,0,TAU);c.clip();
  c.fillStyle=ARTDIAL[S.texture]?ARTDIAL[S.texture].base:D.base;c.fillRect(-dR,-dR,dR*2,dR*2);
  dialTexture(c,dR,S.texture,S.dialCol);
  drawTrack(c,dR,dialInk());
  drawIndices(c,dR,D,M);
  drawComp(c,dR,D.ink,M);
  const blue=S.handMat==='blued';
  c.save();c.rotate(-.9);drawHand(c,S.hands,dR*.52,dR*.055,M,S.lume,blue);c.restore();
  c.save();c.rotate(1.4);drawHand(c,S.hands,dR*.80,dR*.042,M,S.lume,blue);c.restore();
  c.restore();
  drawCrystal(c,dR);
  c.restore();
  Object.assign(S,keep);
}

/* ============================================================
   PROFILE — the elevation. Where thickness, crystal and lug
   curve finally become visible.
   ============================================================ */
function drawProfile(c,R,fam,M){
  const t=THICK[S.thick].v, W=R*(fam.ow||1);
  const H=R*t*3.4;                       /* midcase height */
  const bezH=R*.045, backH=R*.10;
  const yTop=-H/2, yBot=H/2;
  /* ————— strap, leaving the lugs and falling away ————— */
  const strapCol=(S.strap==='leather'||S.strap==='rubber'||S.strap==='canvas')?S.strapCol:null;
  [-1,1].forEach(dir=>{
    c.save();
    c.beginPath();
    c.moveTo(dir*W*.86,yBot-H*.1);
    c.quadraticCurveTo(dir*W*1.55,yBot+H*.2,dir*W*1.95,R*.85);
    c.lineTo(dir*W*1.72,R*.92);
    c.quadraticCurveTo(dir*W*1.36,yBot+H*.34,dir*W*.80,yBot+H*.16);
    c.closePath();
    if(strapCol){
      const g=c.createLinearGradient(0,yBot,0,R);
      g.addColorStop(0,shade(strapCol,.10));g.addColorStop(1,shade(strapCol,-.34));
      c.fillStyle=g;
    }else{
      c.fillStyle=metalFill(c,R*.5,S.metal,'brush');
    }
    c.fill();
    c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=1;c.stroke();
    c.restore();
  });
  /* ————— caseback: a shallow dome ————— */
  c.save();
  c.beginPath();
  c.moveTo(-W*.80,yBot-2);
  c.quadraticCurveTo(0,yBot+backH*2.1,W*.80,yBot-2);
  c.closePath();
  c.fillStyle=metalFill(c,R,S.metal,'brush');c.fill();
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1.2;c.stroke();
  c.restore();
  /* ————— midcase flank ————— */
  c.save();
  c.beginPath();
  c.moveTo(-W,yTop);
  c.lineTo(W,yTop);
  c.quadraticCurveTo(W*1.02,0,W*.80,yBot);
  c.lineTo(-W*.80,yBot);
  c.quadraticCurveTo(-W*1.02,0,-W,yTop);
  c.closePath();
  c.fillStyle=metalFill(c,R,S.metal,S.finish);c.fill();
  if(S.finish==='brush'){c.save();c.clip();brushStrokes(c,R,.09);c.restore();}
  /* polished chamfer catching the light along the top edge */
  const cg=c.createLinearGradient(0,yTop,0,yBot);
  cg.addColorStop(0,'rgba(255,255,255,.34)');cg.addColorStop(.22,'rgba(255,255,255,.04)');
  cg.addColorStop(.8,'rgba(0,0,0,.18)');cg.addColorStop(1,'rgba(0,0,0,.38)');
  c.fillStyle=cg;c.fill();
  c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=1.3;c.stroke();
  c.restore();
  /* ————— lugs, curving down toward the wrist ————— */
  if(S.lug!=='none'&&!fam.slab){
    [-1,1].forEach(dir=>{
      c.save();
      c.beginPath();
      c.moveTo(dir*W*.86,yTop+H*.1);
      c.quadraticCurveTo(dir*W*1.42,yTop+H*.35,dir*W*1.30,yBot+H*.55);
      c.lineTo(dir*W*1.02,yBot+H*.42);
      c.quadraticCurveTo(dir*W*1.06,yTop+H*.6,dir*W*.72,yTop+H*.2);
      c.closePath();
      c.fillStyle=metalFill(c,R*.6,S.metal,S.finish);c.fill();
      c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1.1;c.stroke();
      c.restore();
    });
  }
  /* ————— crown, and pushers on a chronograph ————— */
  c.save();
  const cw=R*.10,ch=R*.15;
  c.fillStyle=metalFill(c,R*.2,S.metal,'polish');
  c.fillRect(W*.96,-ch/2,cw,ch);
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=1;c.strokeRect(W*.96,-ch/2,cw,ch);
  for(let i=0;i<6;i++){c.beginPath();
    c.moveTo(W*.96+cw*(i+.5)/6,-ch/2);c.lineTo(W*.96+cw*(i+.5)/6,ch/2);c.stroke();}
  if(S.comp==='chrono2'||S.comp==='chrono3'){
    [-1,1].forEach(dir=>{
      c.fillStyle=metalFill(c,R*.14,S.metal,'polish');
      c.fillRect(W*.96,dir*ch*.95-ch*.26,cw*.8,ch*.52);
      c.strokeRect(W*.96,dir*ch*.95-ch*.26,cw*.8,ch*.52);
    });
  }
  c.restore();
  /* ————— bezel step ————— */
  c.save();
  c.beginPath();
  c.moveTo(-W,yTop);c.lineTo(W,yTop);
  c.lineTo(W*.985,yTop-bezH);c.lineTo(-W*.985,yTop-bezH);
  c.closePath();
  c.fillStyle=metalFill(c,R,S.metal,S.bezel==='dive'?'brush':'polish');c.fill();
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1.1;c.stroke();
  c.restore();
  /* ————— the crystal: this is the whole point of the view ————— */
  const yG=yTop-bezH;
  const rIn=W*(1-S.bezelW*1.05);
  c.save();
  c.beginPath();
  if(S.crystal==='flat'){
    c.moveTo(-rIn,yG);c.lineTo(-rIn,yG-R*.030);
    c.lineTo(rIn,yG-R*.030);c.lineTo(rIn,yG);
  }else if(S.crystal==='domed'){
    c.moveTo(-rIn,yG);
    c.quadraticCurveTo(0,yG-R*.20,rIn,yG);
  }else if(S.crystal==='ddomed'){
    c.moveTo(-rIn,yG);
    c.bezierCurveTo(-rIn*.5,yG-R*.26,rIn*.5,yG-R*.26,rIn,yG);
  }else{ /* box */
    c.moveTo(-rIn,yG);c.lineTo(-rIn,yG-R*.15);
    c.quadraticCurveTo(0,yG-R*.20,rIn,yG-R*.15);
    c.lineTo(rIn,yG);
  }
  c.closePath();
  /* sapphire has body: a pale tint, then hard speculars along the edges */
  const gg=c.createLinearGradient(-rIn,yG-R*.2,rIn,yG);
  gg.addColorStop(0,'rgba(228,240,246,.62)');gg.addColorStop(.22,'rgba(198,218,228,.30)');
  gg.addColorStop(.5,'rgba(214,230,238,.42)');gg.addColorStop(.78,'rgba(190,212,224,.28)');
  gg.addColorStop(1,'rgba(232,243,248,.60)');
  c.fillStyle=gg;c.fill();
  c.save();c.clip();
  /* the streak the window leaves across the glass */
  c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=R*.016;c.lineCap='round';
  c.beginPath();c.moveTo(-rIn*.72,yG-R*.075);c.lineTo(-rIn*.18,yG-R*.115);c.stroke();
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=R*.008;
  c.beginPath();c.moveTo(rIn*.30,yG-R*.055);c.lineTo(rIn*.62,yG-R*.045);c.stroke();
  c.restore();
  c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.4;c.stroke();
  c.restore();
  /* the dial, edge-on, seen through the glass */
  c.save();
  c.fillStyle=shade(DIALCOL[S.dialCol].base,-.15);
  c.fillRect(-rIn,yG-R*.008,rIn*2,R*.010);
  c.restore();
  /* ————— caption ————— */
  c.save();
  c.fillStyle='rgba(233,228,216,.45)';c.textAlign='center';
  c.font=`400 ${R*.075}px ${FONTS.grot}`;
  c.fillText(`${S.size} MM × ${(S.size*t*1.7).toFixed(1)} MM`,0,R*1.30);
  c.font=`400 ${R*.062}px ${FONTS.grot}`;
  c.fillStyle='rgba(233,228,216,.28)';
  c.fillText(`${THICK[S.thick].n.toUpperCase()} PROFILE · ${CRYSTN[S.crystal].toUpperCase()} CRYSTAL`,0,R*1.44);
  c.restore();
}
const CRYSTN={flat:'Flat',domed:'Domed',ddomed:'Double domed',box:'Box'};
/* ————— certificate ————— */
function certificate(){
  const W=1400,H=1900,c=document.createElement('canvas');
  c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f2ede2';x.fillRect(0,0,W,H);
  /* border */
  x.strokeStyle='#c3bba6';x.lineWidth=2;x.strokeRect(56,56,W-112,H-112);
  x.strokeStyle='#e0d9c6';x.lineWidth=1;x.strokeRect(70,70,W-140,H-140);
  /* mark */
  x.save();x.translate(W/2,196);drawMark(x,86,'#211d16','#c9391b');x.restore();
  x.fillStyle='#211d16';x.textAlign='center';
  x.font='600 46px "Archivo Narrow"';
  if(x.letterSpacing!==undefined)x.letterSpacing='18px';
  x.fillText('AXIS',W/2,320);
  if(x.letterSpacing!==undefined)x.letterSpacing='6px';
  x.fillStyle='#8d867a';x.font='400 17px "Archivo Narrow"';
  x.fillText('INSTRUMENTS OF ROTATION',W/2,352);
  /* the watch */
  const keepBg=S.bg,kx=S.tiltX,ky=S.tiltY;S.bg='#f2ede2';S.tiltX=0;S.tiltY=0;
  const prev=cv.width;renderBase();
  x.drawImage(base,(W-1000)/2,400,1000,1000*(base.height/base.width));
  S.bg=keepBg;S.tiltX=kx;S.tiltY=ky;baseDirty=true;
  /* text block */
  let y=H-620;
  x.textAlign='center';x.fillStyle='#211d16';
  if(x.letterSpacing!==undefined)x.letterSpacing='0px';
  x.font='600 54px "Cormorant Garamond"';
  x.fillText(S.name||'Unnamed design',W/2,y);y+=52;
  x.strokeStyle='#c3bba6';x.beginPath();x.moveTo(W/2-90,y-14);x.lineTo(W/2+90,y-14);x.stroke();
  y+=26;
  const rows=[
    ['CASE',`${FAMILY[S.family].n} · ${S.size} mm · ${THICK[S.thick].n}`],
    ['MATERIAL',`${METAL[S.metal].name}, ${S.finish==='polish'?'polished':(S.finish==='brush'?'brushed':'sandblasted')}`],
    ['BEZEL',`${BEZELS[S.bezel]}`],
    ['DIAL',`${DIALCOL[S.dialCol].name} · ${TEXTURES[S.texture]}`],
    ['INDICES',`${LAYOUTS[S.layout]} · ${S.indexMat==='applied'?'applied':'printed'}`],
    ['FUNCTION',`${COMPN[S.comp]}${S.date!=='none'?', date at '+S.date:''}`],
    ['HANDS',`${HANDS[S.hands]}${S.handMat==='blued'?', flame blued':''}`],
    ['STRAP',`${STRAPN[S.strap]}`]
  ];
  x.font='400 21px "Archivo Narrow"';
  rows.forEach(r=>{
    x.textAlign='right';x.fillStyle='#8d867a';
    if(x.letterSpacing!==undefined)x.letterSpacing='3px';
    x.fillText(r[0],W/2-24,y);
    x.textAlign='left';x.fillStyle='#211d16';
    if(x.letterSpacing!==undefined)x.letterSpacing='0px';
    x.font='400 23px "Archivo Narrow"';
    x.fillText(r[1],W/2+24,y);
    x.font='400 21px "Archivo Narrow"';
    y+=40;
  });
  const serial='AX-'+Math.abs(hashCode(encode())).toString(36).toUpperCase().slice(0,6);
  x.textAlign='center';x.fillStyle='#8d867a';x.font='400 18px "Archivo Narrow"';
  if(x.letterSpacing!==undefined)x.letterSpacing='5px';
  x.fillText('DESIGN No. '+serial,W/2,y+34);
  x.fillText('DESIGNED BY THE OWNER · AXIS STUDIO',W/2,y+66);
  const a=document.createElement('a');
  a.href=c.toDataURL('image/png');
  a.download=(S.name?S.name.replace(/[^\w-]+/g,'-').toLowerCase():'axis')+'-certificate.png';
  document.body.appendChild(a);a.click();a.remove();
}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return h;}

/* ————— actions ————— */
const pick=a=>a[Math.floor(Math.random()*a.length)];
function randomize(){
  S.family=pick(Object.keys(FAMILY));
  S.size=34+Math.round(Math.random()*20)/2;
  S.metal=pick(Object.keys(METAL));
  S.finish=pick(['polish','brush','sand']);
  S.lug=FAMILY[S.family].slab?'none':pick(['wire','straight','twisted','horn']);
  S.bezel=pick(Object.keys(BEZELS));
  S.bezelW=(6+Math.round(Math.random()*12))/100;
  S.dialCol=pick(Object.keys(DIALCOL));
  /* art dials are a treat, not the default */
  S.texture=Math.random()<.22?pick(Object.keys(ARTDIAL)):pick(Object.keys(TEXTURES).filter(k=>!ARTDIAL[k]));
  S.layout=pick(Object.keys(LAYOUTS));
  S.indexMat=pick(['applied','printed']);
  S.numFont=pick(['grot','cond','serif']);
  S.track=pick(['railroad','ticks','dots','none']);
  S.comp=pick(['none','none','small','gmt','moon','power','chrono2','chrono3']);
  S.date=pick(['none','none','3','6']);
  S.hands=pick(Object.keys(HANDS));
  S.handMat=pick(['steel','steel','blued']);
  S.lume=Math.random()>.4;
  S.chapter=Math.random()>.7;
  S.strap=FAMILY[S.family].slab?pick(['oyster','jubilee','president','mesh'])
    :pick(['leather','leather','rubber','canvas','nato','oyster','jubilee','mesh']);
  S.strapCol=pick(STRAPCOL);
  S.stitch=pick(['tonal','contrast']);
  /* curation: keep it believable */
  if(S.bezel==='dive'&&S.layout==='roman')S.layout='baton';
  if(S.texture==='sector')S.layout=pick(['arabic','baton','mixed']);
  if(S.comp==='moon'&&S.date==='6')S.date='none';
  if(S.comp==='chrono2'||S.comp==='chrono3'){
    S.date=pick(['none','none','6']);
    if(S.layout==='explorer'||S.layout==='california')S.layout='baton';
  }
  build();paint();
}
function download(){
  const a=document.createElement('a');
  a.href=cv.toDataURL('image/png');
  a.download=(S.name?S.name.replace(/[^\w-]+/g,'-').toLowerCase():'axis')+'-design.png';
  document.body.appendChild(a);a.click();a.remove();
}
const DEFAULTS=JSON.parse(JSON.stringify(S));
document.getElementById('bRand').onclick=randomize;
document.getElementById('bPng').onclick=download;
document.getElementById('bSave').onclick=()=>{
  navigator.clipboard&&navigator.clipboard.writeText(location.href).catch(()=>{});
  const b=document.getElementById('bSave'),t=b.textContent;
  b.textContent='Link copied';setTimeout(()=>b.textContent=t,1600);
};
document.getElementById('bReset').onclick=()=>{Object.assign(S,DEFAULTS);build();paint();};
document.querySelectorAll('.bgs').forEach(b=>b.onclick=()=>{S.bg=b.dataset.bg;paint();});

/* ————— drag the watch to turn it in the light ————— */
(function(){
  let drag=false,lx=0,ly=0;
  const LIM=.95;
  cv.style.cursor='grab';
  cv.addEventListener('pointerdown',e=>{
    if(S.view!=='studio')return;
    drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing';
    cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  });
  addEventListener('pointermove',e=>{
    if(!drag)return;
    S.tiltY=Math.max(-LIM,Math.min(LIM,(S.tiltY||0)+(e.clientX-lx)*.006));
    S.tiltX=Math.max(-LIM,Math.min(LIM,(S.tiltX||0)-(e.clientY-ly)*.006));
    lx=e.clientX;ly=e.clientY;paint();
  });
  addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab';});
  cv.addEventListener('dblclick',()=>{S.tiltX=0;S.tiltY=0;paint();});
})();

/* ————— loop: base cached, hands live ————— */
let dirty=true,baseDirty=true;
function paint(){dirty=true;baseDirty=true;spec();syncHash();}
let last=0;
function loop(t){
  if(dirty||t-last>200){render();dirty=false;last=t;}
  requestAnimationFrame(loop);
}
function resize(){
  const st=document.getElementById('stage');
  DPR=Math.min(devicePixelRatio||1,2);
  cv.width=st.clientWidth*DPR;cv.height=st.clientHeight*DPR;
  cv.style.width=st.clientWidth+'px';cv.style.height=st.clientHeight+'px';
  paint();
}
/* ————— guide wiring ————— */
document.getElementById('gNext').onclick=()=>{
  if(gStep===GUIDE.length-1)closeGuide();else showGuide(gStep+1);
};
document.getElementById('gSkip').onclick=closeGuide;
document.getElementById('guide').onclick=e=>{if(e.target.id==='guide')closeGuide();};
document.getElementById('bHelp').onclick=()=>showGuide(0);
document.getElementById('glossX').onclick=()=>document.getElementById('gloss').classList.remove('on');
document.getElementById('gloss').onclick=e=>{if(e.target.id==='gloss')e.currentTarget.classList.remove('on');};
(function(){
  const [r1,r2]=markPts(30);
  const g=document.getElementById('guideMark');
  if(g)g.innerHTML=`<path d="${ptsToPath(r1)}" fill-rule="evenodd"/><path d="${ptsToPath(r2)}" fill-rule="evenodd"/><circle cx="0" cy="0" r="2.6"/>`;
})();
addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='Escape'){closeGuide();document.getElementById('gloss').classList.remove('on');}
  if(e.key==='r'||e.key==='R')randomize();
  if(e.key==='d'||e.key==='D')download();
  if(e.key==='?')showGuide(0);
});
addEventListener('resize',resize);
const fromLink=decode();
resize();build();
/* first visit gets the guide; a shared design opens straight into the watch */
try{
  if(!fromLink&&!localStorage.getItem('axis.seen'))setTimeout(()=>showGuide(0),700);
}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{build();resize();});
requestAnimationFrame(loop);
setInterval(()=>{if(document.hidden)render();},400);
window.CAL={S,render,randomize,build,paint,setTab:t=>{tab=t;build();},
  renderBase:()=>{baseDirty=true;render();},
  png:()=>cv.toDataURL('image/png').length,
  link:()=>location.href};

</script>
</body>
